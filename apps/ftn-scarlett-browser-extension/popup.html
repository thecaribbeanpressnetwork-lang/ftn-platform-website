<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scarlett</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <div><strong>Scarlett</strong><small>Adaptive interface by FTN</small></div>
  </header>
  <main>
    <p id="summary">Scarlett adapts only the page you choose.</p>
    <div class="mode-control" aria-label="Scarlett mode">
      <button data-mode="ORIGINAL">Original</button>
      <button data-mode="ASSIST">Assist</button>
      <button data-mode="ADAPT">Adapt</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="page-facts"></div>
  </main>
  <footer>Preserve identity. Replace friction.</footer>
  <script src="popup.js"></script>
</body>
</html>
