<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ Tube — Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px 60px}.eyebrow{color:#ff2436;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.head h1{font-size:clamp(34px,6vw,64px);margin:4px 0}.status{font-size:12px;color:#999}.decks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.deck{background:#111;border:1px solid #292929;border-radius:16px;overflow:hidden}.deck.active{border-color:#ff2436;box-shadow:0 0 0 1px #ff2436 inset}.label{padding:14px 16px;display:flex;justify-content:space-between}.label b{color:#ff2436;font-size:12px;letter-spacing:.14em}.screen{aspect-ratio:16/9;background:#000}.screen>div{width:100%;height:100%}.meta{padding:14px 16px}.title{font-weight:800;font-size:17px}.sub{color:#888;font-size:13px;margin-top:5px}.mixer{margin-top:14px;padding:16px;border:1px solid #292929;border-radius:16px;background:#111;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}.range{display:flex;gap:10px;align-items:center}.range label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.12em}.range input{width:100%;accent-color:#ff2436}.controls{display:flex;gap:8px}.controls button,.item{background:#191919;color:#fff;border:1px solid #333;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.controls button:hover,.item:hover{border-color:#ff2436}.queue{margin-top:14px;background:#111;border:1px solid #292929;border-radius:16px;padding:16px}.queue h2{font-size:15px;margin:0 0 10px}.items{display:grid;gap:7px}.item{display:grid;grid-template-columns:28px 1fr;text-align:left}.item small{display:block;color:#888;margin-top:3px}.add{margin-top:18px}.add h2{font-size:15px}.library{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item strong{font-size:13px}@media(max-width:760px){.decks,.mixer,.library{grid-template-columns:1fr}.controls{justify-content:center}.head{display:block}.status{margin-top:10px}}button:focus,input:focus{outline:2px solid #ff2436;outline-offset:2px}</style></head><body><main class="wrap"><div class="head"><div><div class="eyebrow">FTN Music & Media · Prototype</div><h1>DJ Tube</h1></div><div class="status" id="status">Connecting to YouTube…</div></div><section class="decks"><article class="deck active" id="deckA"><div class="label"><b>DECK A</b><span>Channel 1</span></div><div class="screen"><div id="ytA"></div></div><div class="meta"><div class="title" id="titleA">Soca 2026 Mix — Soca Spark 26</div><div class="sub" id="subA">DJ Ana & Ultra Simmo · Soca</div></div></article><article class="deck" id="deckB"><div class="label"><b>DECK B</b><span>Channel 2</span></div><div class="screen"><div id="ytB"></div></div><div class="meta"><div class="title" id="titleB">Trinidad Carnival 2026 Road Power Soca DJ Mix</div><div class="sub" id="subB">Sir Trey Benjamin · Soca</div></div></article></section><section class="mixer"><div class="range"><label>A/B</label><input id="cross" type="range" min="0" max="100" value="50"></div><div class="controls"><button id="prev">Prev</button><button id="play">Play</button><button id="next">Next</button></div><div class="range"><label>Master</label><input id="master" type="range" min="0" max="100" value="80"></div></section><section class="queue"><h2>Queue</h2><div class="items" id="queue"></div></section><section class="add"><h2>Test mixes</h2><div class="library" id="library"></div></section></main><script>const videos=[{id:'JZ4h_ldPUgk',title:'Soca 2026 Mix — Soca Spark 26',creator:'DJ Ana & Ultra Simmo',genre:'Soca'},{id:'svCJ3C5LviI',title:'Trinidad Carnival 2026 Road Power Soca DJ Mix',creator:'Sir Trey Benjamin',genre:'Soca'},{id:'VG-NhYHjPrE',title:'Dancehall Mix 2026 — 50 Best Dancehall Songs',creator:'DJ Treasure',genre:'Dancehall'},{id:'eKIOU9X0MxI',title:'Dancehall Mix 2026 Vol. 4 — Raw & Clean',creator:'ZJ Liquid Music',genre:'Dancehall'}];let A,B,active=0,playing=false,queue=[...videos];const $=id=>document.getElementById(id);function status(x){$('status').textContent=x}function setActive(n){active=n;$('deckA').classList.toggle('active',n===0);$('deckB').classList.toggle('active',n===1)}function load(n,v,auto=false){const p=n?B:A;if(!p)return;p.loadVideoById(v.id);$(n?'titleB':'titleA').textContent=v.title;$(n?'subB':'subA').textContent=v.creator+' · '+v.genre;setActive(n);if(auto){p.playVideo();playing=true}update()}function current(){return queue.findIndex(v=>v.title===$(active?'titleB':'titleA').textContent)}function update(){$('play').textContent=playing?'Pause':'Play'}function volumes(){const m=+$('master').value,a=+$('cross').value/100;A?.setVolume(Math.round(m*(1-a)));B?.setVolume(Math.round(m*a))}function next(){let i=current();load(active?0:1,queue[(i+1+queue.length)%queue.length],true)}function prev(){let i=current();load(active,queue[(i-1+queue.length)%queue.length],true)}function render(){$('queue').innerHTML=queue.map((v,i)=>'<button class="item" data-i="'+i+'"><b>'+(i+1)+'</b><span><strong>'+v.title+'</strong><small>'+v.creator+' · '+v.genre+'</small></span></button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>load(active,queue[+b.dataset.i],true));$('library').innerHTML=videos.map((v,i)=>'<button class="item" data-add="'+i+'"><b>+</b><span><strong>'+v.title+'</strong><small>'+v.creator+'</small></span></button>').join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{queue.push(videos[+b.dataset.add]);render()})}window.onYouTubeIframeAPIReady=()=>{A=new YT.Player('ytA',{width:'100%',height:'100%',videoId:videos[0].id,playerVars:{controls:1,rel:0,playsinline:1},events:{onReady:()=>{status('YouTube connected · 2-deck mode ready');volumes()},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){active=0;playing=true;update()}if(e.data===YT.PlayerState.ENDED)next()}}});B=new YT.Player('ytB',{width:'100%',height:'100%',videoId:videos[1].id,playerVars:{controls:1,rel:0,playsinline:1},events:{onReady:volumes,onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){active=1;playing=true;update()}if(e.data===YT.PlayerState.ENDED)next()}}})};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);$('play').onclick=()=>{const p=active?B:A;if(!p)return;if(playing){p.pauseVideo();playing=false}else{p.playVideo();playing=true}update()};$('next').onclick=next;$('prev').onclick=prev;$('cross').oninput=volumes;$('master').oninput=volumes;render();</script></body></html>
