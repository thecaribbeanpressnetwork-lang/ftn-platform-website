<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">Gill Reasoning</title><desc id="d">Outcome-first thinking. A conceptual loop from outcome through conditions and evidence to action.</desc><rect width="800" height="400" rx="20" fill="#101217"/><g fill="none" stroke="#d2c5ab" stroke-width="4"><path d="M94 83h105v100H94z"/><path d="M100 82v-22h130v156H70V82h30" stroke="#e94750"/><path d="m215 209 15 7-15 7" stroke="#e94750"/></g><text x="278" y="144" fill="#f5f0e7" font-family="Georgia,serif" font-size="78">Gill</text><text x="280" y="202" fill="#f5f0e7" font-family="Arial,sans-serif" font-size="38" letter-spacing="5">REASONING</text><path d="M60 275h680" stroke="#333741"/><text x="60" y="320" fill="#d2c5ab" font-family="Arial,sans-serif" font-size="24" letter-spacing="3">OUTCOME → CONDITIONS → EVIDENCE → ACTION</text><text x="60" y="356" fill="#9299a6" font-family="Arial,sans-serif" font-size="20">START WITH THE RESULT. EXAMINE WHAT MADE IT POSSIBLE.</text></svg>