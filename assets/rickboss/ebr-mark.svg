<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">EBR — Evidence-Bounded Retrodiction</title><desc id="d">The evidence profile Phi of h equals mechanism coverage, independent provenance roots, contradiction burden and unresolved bridges. A research profile, not a probability distribution.</desc><rect width="800" height="400" rx="20" fill="#101217"/><g fill="none" stroke="#e94750" stroke-width="3"><path d="M60 70h70v65h-70zM82 91h70v65H82zM104 112h70v65h-70z"/><path d="M174 145h42"/></g><text x="248" y="177" fill="#f5f0e7" font-family="Arial,sans-serif" font-size="128" font-weight="700" letter-spacing="10">EBR</text><text x="60" y="243" fill="#d2c5ab" font-family="Georgia,serif" font-size="37">Φ(h) = ⟨ m(h), n<tspan baseline-shift="sub" font-size="22">π</tspan>(h), c(h), u(h) ⟩</text><path d="M60 275h680" stroke="#333741"/><text x="60" y="320" fill="#f5f0e7" font-family="Arial,sans-serif" font-size="24" letter-spacing="2">EVIDENCE-BOUNDED RETRODICTION</text><text x="60" y="356" fill="#9299a6" font-family="Arial,sans-serif" font-size="20">CAUSAL HISTORIES. VISIBLE EVIDENCE. BOUNDED CLAIMS.</text></svg>