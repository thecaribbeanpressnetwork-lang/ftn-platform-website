name: ibis Bytez Current Video Proof

on:
  push:
    branches: [ibis-recovery-2026-09-09]
    paths:
      - .github/workflows/ibis-bytez-mochi-proof.yml
      - tests/ibis-live-recovery-proof.mjs
      - supabase/functions/ibis-video-bytez/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-video-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run current reviewed-model live proof
        env:
          FTN_TEST_BASE: https://ibis-recovery-2026-09-09.ftn-platform-website.pages.dev
        run: node tests/ibis-live-recovery-proof.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibis-bytez-current-video-proof-${{ github.run_number }}
          path: test-artifacts/
          if-no-files-found: warn
