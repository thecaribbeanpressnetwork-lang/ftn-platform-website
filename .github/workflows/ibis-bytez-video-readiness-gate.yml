name: ibis Bytez Video Readiness Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [ibis-recovery-2026-09-09]
    paths: [.github/workflows/ibis-bytez-video-readiness-gate.yml]
  workflow_dispatch:
    inputs:
      run_free_video_proof:
        description: 'Use Bytez free credits for one Wan2.1 video proof'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bytez-video-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Bytez free-credit-only source contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-video-bytez/index.ts','utf8');
          for(const required of ['Wan-AI/Wan2.1-T2V-1.3B','Apache-2.0','freeCreditOnly: true','paidFallbackImplemented: false','confirmFreeCreditUse','upstream.status === 402','No paid fallback exists','generationAttempted: false','action === "catalog"']) if(!src.includes(required)) throw new Error(`missing Bytez free-credit invariant: ${required}`);
          for(const forbidden of ['autoReload(', 'auto_reload(', 'topUp(', 'top_up(', 'purchaseCredits(', 'purchase_credits(']) if(src.includes(forbidden)) throw new Error(`Bytez adapter contains forbidden paid operation: ${forbidden}`);
          console.log('Bytez free-credit-only source contract: PASS');
          NODE
      - name: Probe deployed Bytez route without generation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1], endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-bytez';
          const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'},body:JSON.stringify({action:'health'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`Bytez health HTTP ${response.status}: ${body.error||'unknown'}`);
          if(body.capability!=='VIDEO_GENERATION'||body.provider!=='bytez'||body.model!=='Wan-AI/Wan2.1-T2V-1.3B')throw new Error('Bytez health identity mismatch');
          if(body.modelLicense!=='Apache-2.0'||body.freeCreditOnly!==true||body.paidFallbackImplemented!==false||body.generationAttempted!==false)throw new Error(`Bytez health policy mismatch: ${JSON.stringify(body)}`);
          if(body.configured!==true||body.readyToGenerate!==true)throw new Error(`Bytez key is not visible to the deployed function: ${JSON.stringify(body)}`);
          console.log('Bytez video health: CONFIGURED / FREE-CREDIT-ONLY; no generation attempted.');
          NODE
      - name: Inspect live Bytez text-to-video catalog without inference
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1], endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-bytez';
          const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'},body:JSON.stringify({action:'catalog'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`Bytez catalog HTTP ${response.status}: ${body.error||'unknown'} providerStatus=${body.providerStatus??'n/a'}`);
          if(body.catalogChecked!==true||body.generationAttempted!==false)throw new Error('Bytez catalog probe must be zero-inference');
          console.log('BYTEZ_VIDEO_CATALOG='+JSON.stringify({targetAvailable:body.targetAvailable,target:body.target,candidates:body.candidates}));
          NODE
      - name: Generate and validate one Bytez free-credit video
        if: (github.event_name == 'workflow_dispatch' && inputs.run_free_video_proof == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Run one free Bytez video proof')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8'); const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1], endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'generate',confirmFreeCreditUse:true,prompt:'A cinematic red ibis standing beside turquoise Caribbean water at sunrise, gentle natural motion in feathers and waves, realistic documentary style, no text.'})});
          const body=await response.json().catch(()=>({}));
          if(response.status===402)throw new Error('Bytez free credits are exhausted; paid fallback remained disabled.');
          if(!response.ok)throw new Error(`Bytez generation HTTP ${response.status}: ${body.error||'unknown'} providerStatus=${body.providerStatus??'n/a'} providerError=${body.providerError??'n/a'}`);
          if(body.provider!=='Bytez'||body.model!=='Wan-AI/Wan2.1-T2V-1.3B'||body.modelLicense!=='Apache-2.0'||body.freeCreditOnly!==true)throw new Error('Bytez generation provenance mismatch');
          if(typeof body.videoUrl!=='string'||!/^https:\/\//i.test(body.videoUrl))throw new Error('Bytez returned no HTTPS video URL');
          const artifact=await fetch(body.videoUrl); if(!artifact.ok)throw new Error(`Returned video URL HTTP ${artifact.status}`);
          const bytes=new Uint8Array(await artifact.arrayBuffer()); if(bytes.length<10000)throw new Error(`Returned video artifact too small: ${bytes.length} bytes`);
          const ascii=String.fromCharCode(...bytes.slice(0,16)), contentType=(artifact.headers.get('content-type')||'').toLowerCase();
          if(!ascii.includes('ftyp')&&!contentType.startsWith('video/'))throw new Error(`Returned artifact is not recognizably video: ${contentType||'no content-type'}`);
          console.log(`Bytez free-credit video proof: PASS (${bytes.length} bytes, ${contentType||'video type inferred'}).`);
          NODE
