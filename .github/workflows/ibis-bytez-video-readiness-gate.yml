name: ibis Bytez Video Readiness Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_free_video_proof:
        description: 'Use Bytez free credits for one Wan2.1 video proof'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bytez-video-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Bytez fail-closed source contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-video-bytez/index.ts','utf8');
          for(const required of [
            'Wan-AI/Wan2.1-T2V-1.3B',
            'Apache-2.0',
            'freeCreditOnly: true',
            'paidFallbackImplemented: false',
            'confirmFreeCreditUse',
            'upstream.status === 402',
            'No paid fallback exists',
            'requiresCatalogPreflight: true',
            'providerState.providerHealthy',
            'providerState.targetAvailable'
          ]) if(!src.includes(required)) throw new Error(`missing Bytez readiness invariant: ${required}`);
          for(const forbidden of ['autoReload(', 'auto_reload(', 'topUp(', 'top_up(', 'purchaseCredits(', 'purchase_credits(']) {
            if(src.includes(forbidden)) throw new Error(`Bytez adapter contains forbidden paid operation: ${forbidden}`);
          }
          console.log('Bytez fail-closed source contract: PASS');
          NODE
      - name: Probe credential state without inference
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`Bytez health HTTP ${response.status}: ${body.error||'unknown'}`);
          if(body.capability!=='VIDEO_GENERATION'||body.provider!=='bytez'||body.model!=='Wan-AI/Wan2.1-T2V-1.3B')throw new Error('Bytez health identity mismatch');
          if(body.configured!==true||body.credentialConfigured!==true)throw new Error('Bytez credential is not visible to deployed function');
          if(body.freeCreditOnly!==true||body.paidFallbackImplemented!==false||body.requiresCatalogPreflight!==true||body.generationAttempted!==false)throw new Error('Bytez free-credit policy mismatch');
          if(body.readyToGenerate!==false)throw new Error('Credential-only health must never claim Bytez is ready to generate');
          console.log('Bytez credential: CONFIGURED; execution remains provider-health gated; no inference attempted.');
          NODE
      - name: Probe live Bytez provider catalog without inference
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'catalog'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`FTN Bytez catalog probe HTTP ${response.status}: ${body.error||'unknown'}`);
          if(body.catalogChecked!==true||body.generationAttempted!==false)throw new Error('Catalog probe must remain zero-inference');
          if(body.providerHealthy===true){
            console.log('BYTEZ_PROVIDER_HEALTHY='+JSON.stringify({targetAvailable:body.targetAvailable,target:body.target,candidates:body.candidates}));
          } else {
            if(body.readyToGenerate!==false)throw new Error('Unhealthy Bytez provider must not be marked ready');
            console.log(`BYTEZ_PROVIDER_UNHEALTHY status=${body.providerStatus??'network'}; generation disabled.`);
          }
          NODE
      - name: Generate and validate one Bytez free-credit video
        if: github.event_name == 'workflow_dispatch' && inputs.run_free_video_proof == true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const preflight=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'catalog'})});
          const p=await preflight.json().catch(()=>({}));
          if(!preflight.ok||p.providerHealthy!==true||p.targetAvailable!==true)throw new Error('Bytez provider/model is not healthy; proof aborted before inference');
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'generate',confirmFreeCreditUse:true,prompt:'A cinematic red ibis standing beside turquoise Caribbean water at sunrise, gentle natural motion in feathers and waves, realistic documentary style, no text.'})});
          const body=await response.json().catch(()=>({}));
          if(response.status===402)throw new Error('Bytez free credits are exhausted; paid fallback remained disabled.');
          if(!response.ok)throw new Error(`Bytez generation HTTP ${response.status}: ${body.error||'unknown'} providerStatus=${body.providerStatus??'n/a'}`);
          if(body.provider!=='Bytez'||body.model!=='Wan-AI/Wan2.1-T2V-1.3B'||body.modelLicense!=='Apache-2.0'||body.freeCreditOnly!==true)throw new Error('Bytez provenance mismatch');
          if(typeof body.videoUrl!=='string'||!/^https:\/\//i.test(body.videoUrl))throw new Error('Bytez returned no HTTPS video URL');
          const artifact=await fetch(body.videoUrl);
          if(!artifact.ok)throw new Error(`Returned video URL HTTP ${artifact.status}`);
          const bytes=new Uint8Array(await artifact.arrayBuffer());
          const ascii=String.fromCharCode(...bytes.slice(0,16));
          const contentType=(artifact.headers.get('content-type')||'').toLowerCase();
          if(bytes.length<10000||(!ascii.includes('ftyp')&&!contentType.startsWith('video/')))throw new Error('Returned artifact is not a validated video');
          console.log(`Bytez free-credit video proof: PASS (${bytes.length} bytes, ${contentType||'MP4 inferred'}).`);
          NODE
