name: ibis Live Adapter Gate

on:
  push:
    branches: [feature/ibis-1-interface]
    paths:
      - '.github/workflows/ibis-live-adapter-gate.yml'
      - 'js/ibis-live-research.js'
      - 'js/ibis-provider-registry.js'
      - 'supabase/functions/ibis-*/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-adapter-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Prove public current-research adapters
        shell: bash
        run: |
          set -euo pipefail
          HN="$(curl --fail --silent --show-error --max-time 15 'https://hn.algolia.com/api/v1/search?query=Caribbean&tags=story&hitsPerPage=1')"
          GH="$(curl --fail --silent --show-error --max-time 15 -H 'Accept: application/vnd.github+json' 'https://api.github.com/search/repositories?q=Caribbean&sort=updated&order=desc&per_page=1')"
          node -e 'const x=JSON.parse(process.argv[1]); if(!Array.isArray(x.hits)) process.exit(1); console.log("Hacker News adapter OK; hits:",x.hits.length)' "$HN"
          node -e 'const x=JSON.parse(process.argv[1]); if(!Array.isArray(x.items)) process.exit(1); console.log("GitHub public-search adapter OK; items:",x.items.length)' "$GH"

      - name: Prove deployed ibis assistant reaches upstream model
        shell: bash
        env:
          SUPABASE_URL: https://jshmidfpqrajxtukzges.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzaG1pZGZwcXJhanh0dWt6Z2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjkwMjIsImV4cCI6MjA5ODM0NTAyMn0.GWyeaQr53LljtTn_WmWfjDvC9ZUU_fI2tzlx3Ty5-0c
        run: |
          set -euo pipefail
          BODY='{"messages":[{"role":"user","content":"Reply with exactly IBIS-LIVE-OK and nothing else."}]}'
          HTTP_CODE="$(curl --silent --show-error --max-time 30 -o /tmp/ibis-live.json -w '%{http_code}' \
            "$SUPABASE_URL/functions/v1/ibis-assistant" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://ftnplatform.org' \
            --data "$BODY")"
          cat /tmp/ibis-live.json
          test "$HTTP_CODE" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/ibis-live.json','utf8'));
          if(typeof body.answer!=='string'||!body.answer.trim()) throw new Error('No model answer returned');
          if(!body.provider||!body.model||!body.generatedAt) throw new Error('Missing provider provenance');
          console.log('ibis assistant upstream OK:', body.provider, body.model, body.generatedAt);
          NODE

      - name: Record gate scope
        run: |
          echo 'NOTE: This gate proves the guest assistant upstream plus the two zero-credential public research adapters.'
          echo 'It does NOT prove authenticated ibis-query/Gemini because a real FTN user JWT is intentionally not stored in CI.'
