name: FTN Scout 2.0

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC = 06:30 Trinidad & Tobago (AST), daily.
    - cron: '30 10 * * *'
  push:
    branches: [ main ]
    paths:
      - 'scripts/ftn-scout-2.mjs'
      - 'scripts/ftn-scout-2-discover.mjs'
      - 'tests/ftn-scout-2-audit.mjs'
      - 'data/scout-2-*.json'
      - '.github/workflows/scout-2.yml'

permissions:
  contents: read

jobs:
  scout-2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run zero-token official-source discovery watch
        run: node scripts/ftn-scout-2-discover.mjs --out=/tmp/FTN_Scout_2_Discovery.md --json=/tmp/FTN_Scout_2_Discovery.json
      - name: Verify Scout 2.0 decision gates
        run: node tests/ftn-scout-2-audit.mjs
      - name: Run Scout 2.0 against current verified intelligence
        run: node scripts/ftn-scout-2.mjs --out=/tmp/FTN_Scout_2_Report.md --json=/tmp/FTN_Scout_2_Report.json
      - name: Retain founder intelligence reports
        uses: actions/upload-artifact@v4
        with:
          name: FTN-Scout-2-Report
          path: |
            /tmp/FTN_Scout_2_Discovery.md
            /tmp/FTN_Scout_2_Discovery.json
            /tmp/FTN_Scout_2_Report.md
            /tmp/FTN_Scout_2_Report.json
          retention-days: 90
