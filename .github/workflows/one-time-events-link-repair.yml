name: One-time Events link repair
on:
  push:
    paths: ['.github/workflows/one-time-events-link-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair Events initial RFQ link and stale ibis label
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/events-workspace.js')
          s=p.read_text()
          old='id="events-rfq-email" class="btn btn-primary" href="mailto:">Email RFQ</a>'
          new='id="events-rfq-email" class="btn btn-primary" href="#events-rfq" aria-disabled="true">Email RFQ</a>'
          if old not in s:
              raise SystemExit('initial empty RFQ mailto not found')
          s=s.replace(old,new,1)
          old_update="mail.href='mailto:?subject='+encodeURIComponent('RFQ — FTN Events')+'&body='+encodeURIComponent(txt);wa.href="
          new_update="mail.href='mailto:?subject='+encodeURIComponent('RFQ — FTN Events')+'&body='+encodeURIComponent(txt);mail.removeAttribute('aria-disabled');wa.href="
          if old_update not in s:
              raise SystemExit('RFQ update function signature not found')
          p.write_text(s.replace(old_update,new_update,1))

          e=Path('events/index.html')
          html=e.read_text()
          if 'FTN ibis' not in html:
              raise SystemExit('Events stale FTN ibis label not found')
          e.write_text(html.replace('FTN ibis','ibis-ai'))
          PY
          node tests/product-registry-audit.mjs
          node scripts/sync-footer.mjs --check
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-events-link-repair.yml
          git add js/events-workspace.js events/index.html
          git diff --cached --check
          git commit -m 'Repair Events RFQ link and ibis-ai footer identity'
          git push origin HEAD:main
