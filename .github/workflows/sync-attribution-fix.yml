name: FTN Attribution Repair
on:
  push:
    branches: [fix/ftn-attribution-index-readiness]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ftn-attribution-index-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-ftn-attribution.mjs
      - run: node scripts/sync-footer.mjs
      - name: Commit generated repairs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply sitewide FTN attribution and footer repair"
          git push
