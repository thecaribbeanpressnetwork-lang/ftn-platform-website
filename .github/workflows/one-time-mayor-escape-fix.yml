name: One-time Mayor escape correction
on:
  push:
    paths: ['.github/workflows/one-time-mayor-escape-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct HTML quote entity and retire workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/mayor-dashboard.js')
          s=p.read_text()
          old='\'"\':\'&quot\''
          new='\'"\':\'&quot;\''
          if old not in s:
              raise SystemExit('expected typo not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-mayor-escape-fix.yml
          git add js/mayor-dashboard.js
          git diff --cached --check
          git commit -m 'Correct Mayor Mode HTML escaping'
          git push origin HEAD:main
