name: ibis Live Recovery Proof

on:
  push:
    branches: [ibis-recovery-2026-09-09]
    paths:
      - tests/ibis-live-recovery-proof.mjs
      - .github/workflows/ibis-live-recovery-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live recovery proof
        env:
          FTN_TEST_BASE: https://ibis-recovery-2026-09-09.ftn-platform-website.pages.dev
        run: node tests/ibis-live-recovery-proof.mjs
      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibis-live-recovery-proof-${{ github.run_number }}
          path: test-artifacts/
          if-no-files-found: warn
