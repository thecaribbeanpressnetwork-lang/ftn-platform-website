name: ibis Caribbean Live Data Gate

on:
  push:
    branches: [feature/ibis-1-interface]
    paths:
      - '.github/workflows/ibis-caribbean-live-gate.yml'
      - 'scripts/update-ttps-crime.mjs'
      - 'scripts/update-fx-rate.mjs'
      - 'scripts/lib/statistics-source-adapter.mjs'
      - 'scripts/lib/cbtt-fx-parser.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caribbean-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Prove TTPS official-source ingestion
        run: |
          set -euo pipefail
          node scripts/update-ttps-crime.mjs | tee /tmp/ttps-proof.txt
          grep -Eq '^TTPS [0-9]{4}-[0-9]{2}-[0-9]{2}: [0-9]+ reported, [0-9]+ detected$' /tmp/ttps-proof.txt
          node -e "const x=require('./data/crime-statistics.json'); if(!Number.isFinite(x.current.reported)||!Number.isFinite(x.current.detected)||!x.current.asOf) process.exit(1); console.log('TTPS snapshot verified:',x.current.asOf,x.current.reported,x.current.detected)"

      - name: Prove Central Bank official FX ingestion
        run: |
          set -euo pipefail
          node scripts/update-fx-rate.mjs | tee /tmp/cbtt-proof.txt
          grep -Eq '^Central Bank FX [0-9]{4}-[0-9]{2}-[0-9]{2}: [0-9]+ monthly USD rate observation\(s\), latest .+ \(buy [0-9.]+, sell [0-9.]+\)$' /tmp/cbtt-proof.txt
          node -e "const x=require('./data/fx-usd-ttd.json'); const r=x.monthly?.at(-1); if(!r||!Number.isFinite(r.usdBuying)||!Number.isFinite(r.usdSelling)||!x.source?.url) process.exit(1); console.log('CBTT snapshot verified:',r.period,r.usdBuying,r.usdSelling)"

      - name: Assert provenance is preserved
        run: |
          node - <<'NODE'
          const crime=require('./data/crime-statistics.json');
          const fx=require('./data/fx-usd-ttd.json');
          if(!String(crime.source?.url||'').includes('ttps.gov.tt')) throw new Error('TTPS provenance missing');
          if(!String(fx.source?.url||'').includes('central-bank.org.tt')) throw new Error('CBTT provenance missing');
          console.log('Official-source provenance gate passed');
          NODE
