name: Scarlett Gate

on:
  pull_request:
    paths:
      - 'apps/ftn-scarlett-browser-extension/**'
      - 'supabase/functions/ftn-scarlett-billing/**'
      - 'supabase/functions/ftn-scarlett-wam-webhook/**'
      - 'supabase/functions/ftn-scarlett-telemetry/**'
      - 'supabase/functions/ftn-owner-control/**'
      - 'supabase/migrations/20260919120000_ftn_scarlett_wam_billing.sql'
      - 'supabase/migrations/20260919140000_ftn_scarlett_analytics.sql'
      - 'scarlett/**'
      - 'god-mode/scarlett/**'
      - 'js/ftn-scarlett-bridge.js'
      - 'js/scarlett-pricing.js'
      - 'js/scarlett-acquisition.js'
      - 'js/scarlett-analytics-dashboard.js'
      - 'js/god-mode-scarlett-link.js'
      - 'css/components/scarlett-page.css'
      - 'css/components/scarlett-pricing.css'
      - 'legal/privacy-policy/index.html'
      - 'tests/scarlett-audit.mjs'
      - 'tests/scarlett-wam-billing-audit.mjs'
      - 'tests/scarlett-analytics-audit.mjs'
      - 'docs/SCARLETT_V1_AUDIT_AND_BUILD_PLAN_2026-09-19.md'
      - 'docs/SCARLETT_ARCHITECTURE_AND_SECURITY_2026-09-19.md'
      - 'docs/SCARLETT_V2_ARCHITECTURE_2026-09-19.md'
      - 'docs/SCARLETT_V2_INVESTOR_READINESS_2026-09-19.md'
      - 'docs/SCARLETT_V2_ANALYTICS_PRIVACY_MODEL.md'
      - 'docs/SCARLETT_V2_ACCOUNT_AND_BILLING_ARCHITECTURE.md'
      - 'docs/FTN_SCARLETT_ANALYTICS_PIPELINE.md'
      - '.github/workflows/scarlett-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/scarlett-audit.mjs
      - run: node tests/scarlett-wam-billing-audit.mjs
      - run: node tests/scarlett-analytics-audit.mjs
      - run: node tests/product-registry-audit.mjs
      - run: node tests/nav-registry-audit.mjs
      - run: node scripts/generate-sitemap.mjs --check
      - run: node scripts/sync-footer.mjs --check
      - run: node tests/asset-manifest-audit.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ftn-scarlett-telemetry/index.ts
      - run: deno check supabase/functions/ftn-scarlett-billing/index.ts
      - run: deno check supabase/functions/ftn-scarlett-wam-webhook/index.ts
