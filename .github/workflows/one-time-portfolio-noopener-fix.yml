name: One-time portfolio noopener repair
on:
  push:
    paths: ['.github/workflows/one-time-portfolio-noopener-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add noopener to portfolio target-blank links and retire repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portfolio/rg-brand-7f3k2/index.html')
          s=p.read_text()
          count=s.count('target="_blank" rel="noreferrer"')
          if count != 8:
              raise SystemExit(f'expected 8 portfolio target-blank links, found {count}')
          p.write_text(s.replace('target="_blank" rel="noreferrer"','target="_blank" rel="noopener noreferrer"'))
          PY
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-portfolio-noopener-fix.yml
          git add portfolio/rg-brand-7f3k2/index.html
          git diff --cached --check
          git commit -m 'Harden portfolio target-blank links with noopener'
          git push origin HEAD:main
