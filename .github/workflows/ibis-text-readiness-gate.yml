name: ibis Text Readiness Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify text source truth contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-text-cloudflare/index.ts','utf8');
          const gateway=fs.readFileSync('supabase/functions/ibis-assistant/index.ts','utf8');
          for(const required of ['payload.action === "health"','inferenceAttempted: false','AbortSignal.timeout(20_000)','@cf/meta/llama-3.1-8b-instruct']){
            if(!src.includes(required))throw new Error(`missing text readiness invariant: ${required}`);
          }
          // Investor-critical CI drift fix (2026-09-19): a second, independent stale assertion in
          // this same gate -- a prior refactor renamed this array from `providers` to `list` (adding
          // the DeepSeek/Item L reasoning-budget-aware reordering), but this check was never updated
          // to match, so THIS step alone had been failing the whole job before the deployed-health
          // check below (step 2) ever ran. Checking Cloudflare's plain presence as the first entry of
          // the literal array, independent of whatever the array is named, is robust to a future
          // rename in the same way the array's own content already is.
          if(!/const \w+ = \[cloudflare\(turns, system\), anthropic\(/.test(gateway))throw new Error('production gateway must attempt proven zero-cost Cloudflare before paid external models');
          console.log('Text source and gateway ordering contract: PASS');
          NODE
      - name: Probe deployed text and assistant gateway without inference
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key from existing client source');
          const key=match[1];
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const textEndpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-text-cloudflare';
          const response=await fetch(textEndpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`text health HTTP ${response.status}: ${body.error||'unknown'}`);
          // Investor-critical CI drift fix (2026-09-19): this route's deployed health response has
          // legitimately evolved from a single-provider shape (provider:'cloudflare-workers-ai') to a
          // multi-provider gateway shape (provider:'FTN multi-provider text gateway', with a
          // `providers` array listing each backend and whether it's configured) -- confirmed live via
          // direct probe, genuinely healthy (ready:true, configured:true), not a real outage. The old
          // assertion never caught up to this repo's own Phase 5 multi-provider text-gateway work, so
          // this gate had been failing on a real production/repo shape mismatch rather than an actual
          // health problem. Updated to the real, verified contract -- still requires the standalone
          // TEXT capability to be configured/ready with no inference attempted, and now additionally
          // requires Cloudflare Workers AI specifically to be present and configured within the
          // multi-provider list, rather than assuming it is the sole provider.
          if(body.capability!=='TEXT'||body.configured!==true||body.ready!==true||body.inferenceAttempted!==false)throw new Error(`standalone text route health mismatch: ${JSON.stringify(body)}`);
          const standaloneCf=(body.providers||[]).find(p=>p.id==='cloudflare-workers-ai');
          if(!standaloneCf||standaloneCf.configured!==true)throw new Error(`Cloudflare missing/unconfigured in standalone text route's provider list: ${JSON.stringify(body.providers)}`);
          const gatewayEndpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-assistant';
          const health=await fetch(gatewayEndpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const h=await health.json().catch(()=>({}));
          if(!health.ok)throw new Error(`gateway health HTTP ${health.status}`);
          const cf=(h.providers||[]).find(p=>p.id==='cloudflare-workers-ai');
          if(!cf||cf.configured!==true||cf.available!==true)throw new Error(`Cloudflare missing/unavailable from production gateway health: ${JSON.stringify(cf)}`);
          console.log('Live text + production gateway health: READY; no inference attempted.');
          NODE
      - name: Prove production assistant gateway selects Cloudflare
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key from existing client source');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-assistant';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({messages:[{role:'user',content:'Explain in one short sentence why Caribbean context matters when designing a regional product.'}]})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`gateway inference HTTP ${response.status}: ${body.error||'unknown'}`);
          if(body.provider!=='Cloudflare Workers AI'||body.model!=='@cf/meta/llama-3.1-8b-instruct')throw new Error(`unexpected production gateway provider/model: ${body.provider} ${body.model}`);
          if(body.answerClass!=='MODEL_RESPONSE'||typeof body.answer!=='string'||body.answer.trim().length<20)throw new Error('gateway model response missing/invalid');
          console.log(`Production assistant Cloudflare integration: PASS (${body.answer.length} chars).`);
          NODE
      - name: Run one standalone Cloudflare text inference
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key from existing client source');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-text-cloudflare';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({messages:[{role:'user',content:'In one sentence, what region is Trinidad and Tobago part of?'}]})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`text inference HTTP ${response.status}: ${body.error||'unknown'}`);
          if(body.provider!=='Cloudflare Workers AI'||body.model!=='@cf/meta/llama-3.1-8b-instruct')throw new Error('text provider/model mismatch');
          if(typeof body.answer!=='string'||body.answer.trim().length<10)throw new Error('text answer missing or unexpectedly short');
          console.log(`Standalone live text inference: PASS (${body.answer.length} chars).`);
          NODE
