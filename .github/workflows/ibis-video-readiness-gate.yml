name: ibis Video Readiness Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify LTX spend-gate source contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-video-ltx/index.ts','utf8');
          for(const required of [
            'LTX_PAID_GENERATION_ENABLED',
            'confirmPaidGeneration',
            'approvedCostUsd',
            'maximumCostUsd',
            'PRICE_PER_SECOND_720P = 0.03',
            'generationAttempted: false',
            'ltx-2-3-fast',
            'AbortSignal.timeout(20_000)'
          ]) if(!src.includes(required)) throw new Error(`missing video spend/readiness invariant: ${required}`);
          console.log('LTX spend-gate source contract: PASS');
          NODE
      - name: Probe deployed LTX health and quote without spend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve public Supabase publishable key from existing client source');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-video-ltx';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const health=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const h=await health.json().catch(()=>({}));
          if(!health.ok)throw new Error(`video health HTTP ${health.status}: ${h.error||'unknown'}`);
          if(h.capability!=='VIDEO_GENERATION'||h.provider!=='ltx-api'||h.model!=='ltx-2-3-fast')throw new Error('video health identity mismatch');
          if(h.configured!==true)throw new Error('rotated LTX API key is not configured in FTN Supabase');
          if(h.readyToQuote!==true||h.generationAttempted!==false)throw new Error('video health must be quote-ready and zero-spend');
          if(h.minimumDuration!==6||h.minimumQuotedCostUsd!==0.18)throw new Error(`unexpected reviewed minimum quote: ${JSON.stringify(h)}`);
          if(h.paidGenerationEnabled!==false)throw new Error('paid generation must remain founder-locked during recovery');
          if(h.readyToGenerate!==false)throw new Error('video generation must remain physically locked until founder enables paid generation');
          const quote=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'quote',duration:6,resolution:'1280x720'})});
          const q=await quote.json().catch(()=>({}));
          if(!quote.ok)throw new Error(`video quote HTTP ${quote.status}: ${q.error||'unknown'}`);
          if(q.maximumCostUsd!==0.18||q.pricePerSecondUsd!==0.03||q.customerFundingRequired!==true||q.generationAttempted!==false)throw new Error(`video quote mismatch: ${JSON.stringify(q)}`);
          console.log(`LTX video readiness: CONFIGURED / QUOTE-READY / SPEND-LOCKED ($${q.maximumCostUsd.toFixed(2)} minimum).`);
          NODE
