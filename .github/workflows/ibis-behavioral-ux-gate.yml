name: IBIS Behavioral UX Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavioral-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit CEBOS architecture
        run: node tests/ibis-cebos-architecture-audit.mjs

      - name: Install Playwright
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start static FTN server
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 > /tmp/ftn-behavioral-ux.log 2>&1 &
          echo $! > /tmp/ftn-behavioral-ux.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ftn-behavioral-ux.log
          exit 1

      - name: Run task-based IBIS UX acceptance
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/ibis-behavioral-ux-acceptance.mjs

      - name: Upload behavioral UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibis-behavioral-ux-evidence
          path: test-artifacts/ibis-behavioral-*.png
          if-no-files-found: ignore
