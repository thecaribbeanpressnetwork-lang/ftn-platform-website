name: One-shot Ricardo research publication update

on:
  push:
    paths:
      - '.github/workflows/one-shot-ricardo-research-publication.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Ricardo Gill published research entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('ricardogill/index.html')
          text = path.read_text(encoding='utf-8')

          old_card = '''<article class="feature"><div><span class="eyebrow">Research</span><h3>Evidence-Bounded Retrodiction</h3><p>Research into how persistent agents can reconstruct candidate causal histories without quietly rewriting the past with information learned later.</p></div><p class="meta"><a href="#research">Read the research summary ↓</a></p></article>'''
          new_card = '''<article class="feature"><div><span class="eyebrow">Published research</span><h3>Evidence-Bounded Retrodiction</h3><p>Published research preprint introducing Evidence-Bounded Retrodiction (EBR): a protocol for persistent AI agents to reconstruct candidate causal histories while keeping later knowledge from being silently rewritten into the historical record.</p></div><p class="meta"><a href="https://doi.org/10.5281/zenodo.22681856" target="_blank" rel="noopener noreferrer">Read the published preprint · DOI 10.5281/zenodo.22681856 ↗</a></p></article>'''

          old_research = '''<section class="section" id="research"><div class="wrap"><div class="research-box"><span class="eyebrow">Working paper · persistent agents</span><h2 class="paper-title">From Memory to Causal History: Evidence-Bounded Retrodiction for Persistent Agents</h2><p>Persistent AI systems need a disciplined way to reason about the past. Once an agent learns what eventually happened, it becomes dangerously easy to describe an earlier decision as though later information had already been available. This work explores how an agent can reconstruct candidate causal histories while keeping different kinds of historical knowledge separate.</p><div class="research-diagram"><div><span class="eyebrow">1</span><h3>Historical record</h3><p>What was documented or known at the time?</p></div><div><span class="eyebrow">2</span><h3>Access evidence</h3><p>What evidence supports that an actor actually had access to information then?</p></div><div><span class="eyebrow">3</span><h3>Retrospective causal history</h3><p>What can later evidence support about the mechanism that produced the outcome?</p></div></div><p>Research themes include evidence-bounded retrodiction, temporal provenance, epistemic-time modelling, mechanism-gated causal reconstruction, contradiction preservation, open-set uncertainty and abstention when evidence is insufficient. This is active research; the page does not claim academic acceptance or publication.</p></div></div></section>'''
          new_research = '''<section class="section" id="research"><div class="wrap"><div class="research-box"><span class="eyebrow">Research &amp; Publications · Published preprint</span><h2 class="paper-title">From Memory to Causal History: Evidence-Bounded Retrodiction for Persistent Agents</h2><p class="meta">Ricardo Gill · 2026 · Research Preprint · Zenodo · <a href="https://doi.org/10.5281/zenodo.22681856" target="_blank" rel="noopener noreferrer">DOI 10.5281/zenodo.22681856 ↗</a></p><p><strong>In plain English:</strong> This research explores how an AI could do more than simply remember what happened. It proposes a method for an AI to work backward from what it sees now, examine the evidence available at different points in time, and reconstruct plausible chains of events that explain <strong>how and why the present situation came to be</strong>—while distinguishing facts from assumptions, preserving conflicting evidence, and admitting when there is not enough information to reach a reliable conclusion.</p><div class="research-diagram"><div><span class="eyebrow">1</span><h3>Historical record</h3><p>What was documented or known at the time?</p></div><div><span class="eyebrow">2</span><h3>Access evidence</h3><p>What evidence supports that an actor actually had access to information then?</p></div><div><span class="eyebrow">3</span><h3>Retrospective causal history</h3><p>What can later evidence support about the mechanism that produced the outcome?</p></div></div><p><strong>Technical contribution:</strong> Introduced <strong>Evidence-Bounded Retrodiction (EBR)</strong>, a protocol for persistent AI agents that separates contemporaneous epistemic records, later evidence of historical actor access, and retrospective causal evidence. The framework combines temporal provenance, mechanism-gated causal reconstruction, contradiction preservation, open-set uncertainty, and explicit abstention, supported by an executable synthetic proof concept and falsifiable evaluation framework.</p><p><strong>Why it matters:</strong> Most AI systems are designed primarily to answer questions from information they currently have. EBR investigates a different capability: giving persistent AI systems a disciplined way to reconstruct history, understand the reasoning and evidence surrounding past decisions, learn from those pathways, and avoid rewriting the past with information that only became available later.</p><p class="meta">Published September 9, 2026 as an independently authored, citable research preprint on Zenodo under CC BY 4.0. Publication as a preprint does not imply journal or peer-review acceptance.</p><div class="hero-actions"><a class="btn primary" href="https://doi.org/10.5281/zenodo.22681856" target="_blank" rel="noopener noreferrer">Read the paper on Zenodo ↗</a></div></div></div></section>'''

          if old_card not in text:
              raise SystemExit('Expected selected-work research card not found; refusing partial edit.')
          if old_research not in text:
              raise SystemExit('Expected research section not found; refusing partial edit.')

          text = text.replace(old_card, new_card, 1).replace(old_research, new_research, 1)

          stale = 'This is active research; the page does not claim academic acceptance or publication.'
          if stale in text:
              raise SystemExit('Stale publication disclaimer remains; refusing commit.')
          if text.count('10.5281/zenodo.22681856') < 3:
              raise SystemExit('DOI did not propagate to all intended profile surfaces; refusing commit.')

          path.write_text(text, encoding='utf-8')

      - name: Verify publication metadata
        shell: bash
        run: |
          grep -q 'Research &amp; Publications · Published preprint' ricardogill/index.html
          grep -q 'DOI 10.5281/zenodo.22681856' ricardogill/index.html
          grep -q 'In plain English:' ricardogill/index.html
          grep -q 'Technical contribution:' ricardogill/index.html
          grep -q 'Why it matters:' ricardogill/index.html
          ! grep -q 'does not claim academic acceptance or publication' ricardogill/index.html

      - name: Commit profile update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ricardogill/index.html
          git commit -m 'Publish Ricardo Gill research preprint on profile'
          git push origin HEAD:main
