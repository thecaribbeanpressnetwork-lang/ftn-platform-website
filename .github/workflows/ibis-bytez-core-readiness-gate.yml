name: ibis Bytez Core Readiness Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [ibis-recovery-2026-09-09]
    paths:
      - .github/workflows/ibis-bytez-core-readiness-gate.yml
      - supabase/functions/ibis-bytez/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bytez-core-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Bytez local safety contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-bytez/index.ts','utf8');
          for(const required of [
            'Authorization: `Key ${apiKey}`',
            'freeCreditOnly: true',
            'closedProviderModelsEnabled: false',
            'paidFallbackImplemented: false',
            'perUserByokImplemented: false'
          ]) if(!src.includes(required)) throw new Error(`missing Bytez core invariant: ${required}`);
          for(const forbidden of ['autoReload(', 'topUp(', 'purchaseCredits(', 'payAsYouGo(']) {
            if(src.includes(forbidden)) throw new Error(`forbidden Bytez paid operation: ${forbidden}`);
          }
          console.log('Bytez local safety contract: PASS');
          NODE
      - name: Probe Bytez control plane as optional upstream
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1],endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const health=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const h=await health.json().catch(()=>({}));
          if(!health.ok||h.configured!==true||h.authScheme!=='KEY_PREFIX'||h.freeCreditOnly!==true)throw new Error('Local Bytez adapter health contract failed');
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'list_tasks'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok){
            console.warn(`BYTEZ_UPSTREAM=DEGRADED HTTP ${response.status}; providerStatus=${body.providerStatus??'n/a'}; ${body.error||'upstream unavailable'}`);
            console.warn('Release semantics: optional Bytez upstream degradation does not block FTN-owned/local capabilities. Bytez inference remains unavailable and MUST NOT be advertised as ready.');
            process.exit(0);
          }
          if(body.inferenceAttempted!==false||!Number.isInteger(body.taskCount)||body.taskCount<1){
            console.warn('BYTEZ_UPSTREAM=DEGRADED usable task catalog unavailable; no inference attempted.');
            process.exit(0);
          }
          console.log(`BYTEZ_UPSTREAM=HEALTHY (${body.taskCount} tasks; no inference).`);
          console.log('Bytez individual model execution remains UNVERIFIED until a reviewed model passes E2E.');
          NODE
