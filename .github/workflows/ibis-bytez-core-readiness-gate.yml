name: ibis Bytez Core Readiness Gate

on:
  push:
    branches: [ibis-recovery-2026-09-09]
    paths: [.github/workflows/ibis-bytez-core-readiness-gate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bytez-core-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Bytez core source contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-bytez/index.ts','utf8');
          for(const required of ['Authorization: `Key ${apiKey}`','openai-community/gpt2','MIT','freeCreditOnly: true','closedProviderModelsEnabled: false','paidFallbackImplemented: false','perUserByokImplemented: false']) if(!src.includes(required)) throw new Error(`missing Bytez core invariant: ${required}`);
          for(const forbidden of ['autoReload(', 'topUp(', 'purchaseCredits(', 'payAsYouGo(']) if(src.includes(forbidden)) throw new Error(`forbidden Bytez paid operation: ${forbidden}`);
          console.log('Bytez core source contract: PASS');
          NODE
      - name: Verify Bytez task discovery without inference
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1],endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const health=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const h=await health.json().catch(()=>({}));
          if(!health.ok||h.configured!==true||h.authScheme!=='KEY_PREFIX'||h.freeCreditOnly!==true)throw new Error('Bytez core health failed');
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'list_tasks'})});
          const body=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(`Bytez list_tasks HTTP ${response.status}: ${body.error||'unknown'} providerStatus=${body.providerStatus??'n/a'}`);
          if(body.inferenceAttempted!==false||!Number.isInteger(body.taskCount)||body.taskCount<1)throw new Error('Bytez task discovery returned no usable task catalog');
          console.log(`Bytez task discovery: PASS (${body.taskCount} tasks; no inference).`);
          NODE
      - name: Prove one Bytez open-model inference using free credits
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run one Bytez core free proof'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match)throw new Error('Could not resolve public Supabase publishable key');
          const key=match[1],endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-bytez';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'prove_text',confirmFreeCreditUse:true,text:'FTN Platform is building useful Caribbean technology. Continue this sentence:'})});
          const body=await response.json().catch(()=>({}));
          if(response.status===402)throw new Error('Bytez free credits exhausted; no paid fallback attempted.');
          if(!response.ok)throw new Error(`Bytez proof HTTP ${response.status}: ${body.error||'unknown'} providerStatus=${body.providerStatus??'n/a'}`);
          if(body.provider!=='Bytez'||body.model!=='openai-community/gpt2'||body.modelLicense!=='MIT'||body.freeCreditOnly!==true||body.proofOnly!==true)throw new Error('Bytez core proof provenance mismatch');
          if(body.output===null||body.output===undefined)throw new Error('Bytez core proof returned no output');
          console.log('Bytez open-model inference proof: PASS.');
          NODE
# one-shot free-credit proof marker
