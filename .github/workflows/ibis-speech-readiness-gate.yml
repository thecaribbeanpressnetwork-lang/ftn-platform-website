name: ibis Speech Readiness Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify speech source truth contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const generic=fs.readFileSync('supabase/functions/ibis-speech-cloudflare/index.ts','utf8');
          for(const required of ['payload.action === "health"','generationAttempted: false','AbortSignal.timeout(20_000)','looksLikeMp3','@cf/openai/whisper-large-v3-turbo','@cf/deepgram/aura-2-en']){
            if(!generic.includes(required))throw new Error(`missing generic speech/ASR invariant: ${required}`);
          }
          const founder=fs.readFileSync('supabase/functions/ibis-founder-voice/index.ts','utf8');
          for(const required of ['IBIS_FOUNDER_VOICE_OPEN_URL','IBIS_FOUNDER_VOICE_OPEN_TOKEN','chatterbox-nano','founderVoiceRequired: true','genericVoiceAcceptedAsPrimary: false','voiceIdentity: "IBIS_FOUNDER_VOICE"','looksLikeWav','referenceSampleSha256']){
            if(!founder.includes(required))throw new Error(`missing provider-neutral founder-voice invariant: ${required}`);
          }
          const service=fs.readFileSync('services/ibis-founder-voice-chatterbox/app.py','utf8');
          for(const required of ['ChatterboxTurboTTS.from_pretrained(device="cpu", nano=True)','EXPECTED_REFERENCE_SHA256','IBIS_FOUNDER_VOICE_SERVICE_TOKEN','audio_prompt_path=str(REFERENCE_PATH)','voiceIdentity','PerTh']){
            if(!service.includes(required))throw new Error(`missing open-source founder-voice service invariant: ${required}`);
          }
          const docker=fs.readFileSync('services/ibis-founder-voice-chatterbox/Dockerfile','utf8');
          if(!docker.includes('python:3.11'))throw new Error('Chatterbox service must use supported Python 3.11 runtime');
          const contract=JSON.parse(fs.readFileSync('config/ibis-founder-voice-contract.json','utf8'));
          if(contract.voiceIdentity!=='IBIS_FOUNDER_VOICE')throw new Error('founder voice identity contract mismatch');
          if(contract.primaryProvider?.provider!=='chatterbox-nano'||contract.primaryProvider?.openSource!==true)throw new Error('open-source Chatterbox must be the primary founder voice provider');
          if(contract.privacy?.rawVoiceSampleStoredInRepository!==false||contract.privacy?.referenceMustBeRuntimeMountedSecret!==true)throw new Error('raw founder voice sample must remain private and runtime-mounted');
          if(contract.acceptance?.mustFailClosedIfFounderVoiceUnavailable!==true)throw new Error('founder voice must fail closed when unavailable');
          if(contract.acceptance?.genericFallbackMayNotBePresentedAsFounderVoice!==true)throw new Error('generic voice substitution must be forbidden');
          console.log('Speech source truth contract: open-source founder voice primary; generic Cloudflare speech retained only as explicit fallback/ASR infrastructure.');
          NODE

      - name: Probe deployed speech routes without generation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve the public Supabase publishable key from the existing client source');
          const key=match[1];
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const genericEndpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-speech-cloudflare';
          const generic=await fetch(genericEndpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const genericBody=await generic.json().catch(()=>({}));
          if(!generic.ok)throw new Error(`generic speech health HTTP ${generic.status}: ${genericBody.error||'unknown'}`);
          if(genericBody.configured!==true||genericBody.ready!==true)throw new Error('generic speech/ASR infrastructure is not configured/ready');
          if(genericBody.generationAttempted!==false)throw new Error('generic speech health must not consume generation quota');
          if(!Array.isArray(genericBody.capability)||!genericBody.capability.includes('AUDIO_TRANSCRIPTION'))throw new Error('generic ASR capability mismatch');

          const founderEndpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-founder-voice';
          const founder=await fetch(founderEndpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const founderBody=await founder.json().catch(()=>({}));
          if(!founder.ok)throw new Error(`founder voice health HTTP ${founder.status}: ${founderBody.error||'unknown'}`);
          if(founderBody.founderVoiceRequired!==true||founderBody.genericVoiceAcceptedAsPrimary!==false)throw new Error('deployed founder voice contract mismatch');
          if(founderBody.generationAttempted!==false)throw new Error('founder voice health must not consume generation quota');
          if(founderBody.voiceIdentity!=='IBIS_FOUNDER_VOICE')throw new Error('deployed founder voice identity mismatch');
          if(founderBody.referenceSample?.sha256!=='a1c58062344bb586dad665b9db6b81bba56af85fbffd214a6c17df3f4d270e9b')throw new Error('deployed founder reference provenance mismatch');
          if(founderBody.configured!==true||founderBody.ready!==true||founderBody.voiceEnrolled!==true)throw new Error('IBIS founder voice is not enrolled/configured/ready');
          console.log(`Live speech health: founder voice READY via ${founderBody.provider}; generic route remains explicit fallback/ASR infrastructure.`);
          NODE

      - name: Synthesize founder voice and transcribe one real artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve the public Supabase publishable key from the existing client source');
          const key=match[1];
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const founderEndpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-founder-voice';
          const asrEndpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-speech-cloudflare';
          const phrase='FTN Platform connects the Caribbean.';
          const tts=await fetch(founderEndpoint,{method:'POST',headers,body:JSON.stringify({action:'speak',text:phrase})});
          const ttsBody=await tts.json().catch(()=>({}));
          if(!tts.ok)throw new Error(`Founder TTS HTTP ${tts.status}: ${ttsBody.error||'unknown'}`);
          if(ttsBody.voiceIdentity!=='IBIS_FOUNDER_VOICE')throw new Error('TTS artifact is not identified as founder voice');
          if(!ttsBody.audio)throw new Error('Founder TTS artifact missing audio bytes');
          const bytes=Buffer.from(ttsBody.audio,'base64');
          if(bytes.length<5000)throw new Error(`Founder TTS artifact unexpectedly small: ${bytes.length}`);
          const mp3=(bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33)||(bytes[0]===0xff&&(bytes[1]&0xe0)===0xe0);
          const wav=bytes.subarray(0,4).toString('ascii')==='RIFF'&&bytes.subarray(8,12).toString('ascii')==='WAVE';
          if(!(mp3||wav))throw new Error('Founder TTS bytes are neither recognizable MP3 nor WAV');
          if(mp3&&(ttsBody.mimeType!=='audio/mpeg'||ttsBody.extension!=='mp3'))throw new Error('Founder MP3 metadata invalid');
          if(wav&&(ttsBody.mimeType!=='audio/wav'||ttsBody.extension!=='wav'))throw new Error('Founder WAV metadata invalid');
          const asr=await fetch(asrEndpoint,{method:'POST',headers,body:JSON.stringify({mode:'transcribe',audio:ttsBody.audio})});
          const asrBody=await asr.json().catch(()=>({}));
          if(!asr.ok)throw new Error(`ASR HTTP ${asr.status}: ${asrBody.error||'unknown'}`);
          const normalized=String(asrBody.text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ');
          for(const word of ['ftn','platform','connects','caribbean'])if(!normalized.includes(word))throw new Error(`ASR output missing ${word}: ${asrBody.text}`);
          console.log(`Live founder-voice round trip: PASS (${bytes.length} bytes; provider=${ttsBody.provider}; transcription="${asrBody.text}").`);
          NODE
