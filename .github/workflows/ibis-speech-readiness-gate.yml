name: ibis Speech Readiness Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify speech source truth contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('supabase/functions/ibis-speech-cloudflare/index.ts','utf8');
          for(const required of ['payload.action === "health"','generationAttempted: false','AbortSignal.timeout(20_000)','looksLikeMp3','@cf/openai/whisper-large-v3-turbo','@cf/deepgram/aura-2-en']){
            if(!src.includes(required))throw new Error(`missing speech readiness invariant: ${required}`);
          }
          console.log('Speech source truth contract: PASS');
          NODE

      - name: Probe deployed speech route without generation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve the public Supabase publishable key from the existing client source');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-speech-cloudflare';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const health=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({action:'health'})});
          const body=await health.json().catch(()=>({}));
          if(!health.ok)throw new Error(`speech health HTTP ${health.status}: ${body.error||'unknown'}`);
          if(body.configured!==true||body.ready!==true)throw new Error('speech route is not configured/ready');
          if(body.generationAttempted!==false)throw new Error('speech health must not consume generation quota');
          if(!Array.isArray(body.capability)||!body.capability.includes('TEXT_TO_SPEECH')||!body.capability.includes('AUDIO_TRANSCRIPTION'))throw new Error('speech capability mismatch');
          console.log('Live speech health: READY; no generation attempted.');
          NODE

      - name: Synthesize and transcribe one real speech artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/);
          if(!match)throw new Error('Could not resolve the public Supabase publishable key from the existing client source');
          const key=match[1];
          const endpoint='https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-speech-cloudflare';
          const headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const phrase='FTN Platform connects the Caribbean.';
          const tts=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({mode:'speak',text:phrase})});
          const ttsBody=await tts.json().catch(()=>({}));
          if(!tts.ok)throw new Error(`TTS HTTP ${tts.status}: ${ttsBody.error||'unknown'}`);
          if(ttsBody.mimeType!=='audio/mpeg'||ttsBody.extension!=='mp3'||!ttsBody.audio)throw new Error('TTS artifact metadata invalid');
          const bytes=Buffer.from(ttsBody.audio,'base64');
          if(bytes.length<5000)throw new Error(`TTS artifact unexpectedly small: ${bytes.length}`);
          const id3=bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33;
          const frame=bytes[0]===0xff&&(bytes[1]&0xe0)===0xe0;
          if(!id3&&!frame)throw new Error('TTS bytes are not recognizable MP3');
          const asr=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({mode:'transcribe',audio:ttsBody.audio})});
          const asrBody=await asr.json().catch(()=>({}));
          if(!asr.ok)throw new Error(`ASR HTTP ${asr.status}: ${asrBody.error||'unknown'}`);
          const normalized=String(asrBody.text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ');
          for(const word of ['ftn','platform','connects','caribbean'])if(!normalized.includes(word))throw new Error(`ASR output missing ${word}: ${asrBody.text}`);
          console.log(`Live speech round trip: PASS (${bytes.length} MP3 bytes; transcription="${asrBody.text}").`);
          NODE
