name: ibis Speech Readiness Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify speech source truth contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const generic=fs.readFileSync('supabase/functions/ibis-speech-cloudflare/index.ts','utf8');
          for(const x of ['payload.action === "health"','generationAttempted: false','@cf/openai/whisper-large-v3-turbo']) if(!generic.includes(x)) throw new Error(`missing generic speech invariant: ${x}`);
          const founder=fs.readFileSync('supabase/functions/ibis-founder-voice/index.ts','utf8');
          for(const x of ['IBIS_FOUNDER_VOICE_OPEN_URL','IBIS_FOUNDER_VOICE_OPEN_TOKEN','chatterbox-nano','founderVoiceRequired: true','genericVoiceAcceptedAsPrimary: false','voiceIdentity: "IBIS_FOUNDER_VOICE"','looksLikeWav']) if(!founder.includes(x)) throw new Error(`missing founder gateway invariant: ${x}`);
          const service=fs.readFileSync('services/ibis-founder-voice-chatterbox/app.py','utf8');
          for(const x of ['ChatterboxTurboTTS.from_pretrained(device="cpu", nano=True)','EXPECTED_REFERENCE_SHA256','IBIS_FOUNDER_VOICE_SERVICE_TOKEN','DERIVED_REFERENCE_PATH','audio_prompt_path=str(DERIVED_REFERENCE_PATH)','REFERENCE_WINDOW_START_SECONDS','PerTh']) if(!service.includes(x)) throw new Error(`missing open-source voice invariant: ${x}`);
          const contract=JSON.parse(fs.readFileSync('config/ibis-founder-voice-contract.json','utf8'));
          if(contract.voiceIdentity!=='IBIS_FOUNDER_VOICE') throw new Error('founder identity contract mismatch');
          if(contract.primaryProvider?.provider!=='chatterbox-nano'||contract.primaryProvider?.openSource!==true) throw new Error('Chatterbox Nano must be the open-source primary');
          if(contract.privacy?.rawVoiceSampleStoredInRepository!==false||contract.privacy?.referenceMustBeRuntimeMountedSecret!==true) throw new Error('raw founder sample must stay private');
          if(contract.acceptance?.mustFailClosedIfFounderVoiceUnavailable!==true||contract.acceptance?.genericFallbackMayNotBePresentedAsFounderVoice!==true) throw new Error('voice truth contract weakened');
          console.log('Speech source contract PASS: founder-authenticated Chatterbox Nano primary; no generic substitution.');
          NODE

      - name: Probe deployed speech routes without generation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const client=fs.readFileSync('js/ibis-creative-studio.js','utf8');
          const match=client.match(/PUBLISHABLE_KEY='([^']+)'/); if(!match) throw new Error('public Supabase key missing');
          const key=match[1], headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const call=async(endpoint,body)=>{const r=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(body)});return [r,await r.json().catch(()=>({}))]};
          const [g,gb]=await call('https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-speech-cloudflare',{action:'health'});
          if(!g.ok||gb.configured!==true||gb.ready!==true||gb.generationAttempted!==false) throw new Error('generic ASR/speech infrastructure not ready');
          const [f,fb]=await call('https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-founder-voice',{action:'health'});
          if(!f.ok) throw new Error(`founder health HTTP ${f.status}`);
          if(fb.founderVoiceRequired!==true||fb.genericVoiceAcceptedAsPrimary!==false||fb.voiceIdentity!=='IBIS_FOUNDER_VOICE') throw new Error('deployed founder contract mismatch');
          if(fb.referenceSample?.sha256!=='a1c58062344bb586dad665b9db6b81bba56af85fbffd214a6c17df3f4d270e9b') throw new Error('founder reference provenance mismatch');
          if(fb.configured!==true||fb.ready!==true||fb.voiceEnrolled!==true) throw new Error(`IBIS founder voice is not live/ready (provider=${fb.provider||'none'})`);
          console.log(`Live founder voice health PASS via ${fb.provider}.`);
          NODE

      - name: Synthesize founder voice and transcribe one real artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const match=fs.readFileSync('js/ibis-creative-studio.js','utf8').match(/PUBLISHABLE_KEY='([^']+)'/); if(!match) throw new Error('public Supabase key missing');
          const key=match[1], headers={'content-type':'application/json',apikey:key,authorization:`Bearer ${key}`,origin:'https://ftnplatform.org'};
          const phrase='FTN Platform connects the Caribbean.';
          const r=await fetch('https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-founder-voice',{method:'POST',headers,body:JSON.stringify({action:'speak',text:phrase})});
          const b=await r.json().catch(()=>({})); if(!r.ok) throw new Error(`Founder TTS HTTP ${r.status}: ${b.error||'unknown'}`);
          if(b.voiceIdentity!=='IBIS_FOUNDER_VOICE'||!b.audio) throw new Error('unverified founder audio');
          const bytes=Buffer.from(b.audio,'base64');
          const mp3=(bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33)||(bytes[0]===0xff&&(bytes[1]&0xe0)===0xe0);
          const wav=bytes.subarray(0,4).toString('ascii')==='RIFF'&&bytes.subarray(8,12).toString('ascii')==='WAVE';
          if(bytes.length<5000||!(mp3||wav)) throw new Error('invalid audio artifact');
          const ar=await fetch('https://jshmidfpqrajxtukzges.supabase.co/functions/v1/ibis-speech-cloudflare',{method:'POST',headers,body:JSON.stringify({mode:'transcribe',audio:b.audio})});
          const ab=await ar.json().catch(()=>({})); if(!ar.ok) throw new Error(`ASR HTTP ${ar.status}`);
          const t=String(ab.text||'').toLowerCase(); for(const w of ['ftn','platform','caribbean']) if(!t.includes(w)) throw new Error(`ASR missing ${w}: ${ab.text}`);
          console.log(`Founder voice round trip PASS: ${bytes.length} bytes via ${b.provider}; transcription="${ab.text}"`);
          NODE
