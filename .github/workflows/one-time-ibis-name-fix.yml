name: One-time ibis-ai registry naming correction
on:
  push:
    paths: ['.github/workflows/one-time-ibis-name-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonicalize registry source and generated footers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/product-registry-data.js')
          s=p.read_text()
          old="id:'ibis-ai',name:'FTN ibis',shortName:'ibis',tagline:'Ai powered by Caribbean intelligence.'"
          new="id:'ibis-ai',name:'ibis-ai',shortName:'ibis-ai',tagline:'AI powered by Caribbean intelligence.'"
          if old not in s:
              raise SystemExit('legacy ibis registry identity not found')
          p.write_text(s.replace(old,new,1))
          PY
          node scripts/sync-footer.mjs
          node tests/product-registry-audit.mjs
          node scripts/sync-footer.mjs --check
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-ibis-name-fix.yml
          git add js/product-registry-data.js '*.html' '*/index.html' '*/*/index.html' || true
          git diff --cached --check
          git commit -m 'Finish canonical ibis-ai registry identity'
          git push origin HEAD:main
