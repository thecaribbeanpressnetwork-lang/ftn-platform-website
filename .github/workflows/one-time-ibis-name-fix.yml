name: One-time ibis-ai registry naming correction
on:
  push:
    paths: ['.github/workflows/one-time-ibis-name-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align audit with canonical ibis-ai identity and retire migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/product-registry-audit.mjs')
          s=p.read_text()
          old="'FTN Community Connect','FTN Face The Nation','FTN ibis','FTN Invest-in'"
          new="'FTN Community Connect','FTN Face The Nation','ibis-ai','FTN Invest-in'"
          if old not in s:
              raise SystemExit('legacy FTN ibis audit assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          node tests/product-registry-audit.mjs
          node scripts/sync-footer.mjs --check
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-ibis-name-fix.yml
          git add tests/product-registry-audit.mjs
          git diff --cached --check
          git commit -m 'Canonicalize ibis-ai audit identity and retire migration'
          git push origin HEAD:main
