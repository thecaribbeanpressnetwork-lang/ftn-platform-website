name: One-time ibis-ai registry naming correction
on:
  push:
    paths: ['.github/workflows/one-time-ibis-name-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonicalize ibis-ai registry and audit, then retire migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          registry=Path('js/product-registry-data.js')
          s=registry.read_text()
          old="id:'ibis-ai',name:'FTN ibis',shortName:'ibis',tagline:'Ai powered by Caribbean intelligence.'"
          new="id:'ibis-ai',name:'ibis-ai',shortName:'ibis-ai',tagline:'AI powered by Caribbean intelligence.'"
          if old not in s:
              raise SystemExit('legacy ibis registry identity not found')
          registry.write_text(s.replace(old,new,1))

          audit=Path('tests/product-registry-audit.mjs')
          a=audit.read_text()
          old_a="'FTN Community Connect','FTN Face The Nation','FTN ibis','FTN Invest-in'"
          new_a="'FTN Community Connect','FTN Face The Nation','ibis-ai','FTN Invest-in'"
          if old_a not in a:
              raise SystemExit('legacy FTN ibis audit assertion not found')
          audit.write_text(a.replace(old_a,new_a,1))
          PY
          node scripts/sync-footer.mjs
          node tests/product-registry-audit.mjs
          node scripts/sync-footer.mjs --check
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-ibis-name-fix.yml
          git add js/product-registry-data.js tests/product-registry-audit.mjs '*.html' '*/index.html' '*/*/index.html' || true
          git diff --cached --check
          git commit -m 'Canonicalize ibis-ai identity and retire migration'
          git push origin HEAD:main
