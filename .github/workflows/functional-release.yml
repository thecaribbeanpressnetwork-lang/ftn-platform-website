name: FTN Functional Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Git-owned FTN backend source
        run: node tests/backend-source-audit.mjs

      - name: Audit CSP dependency and inline-script surface
        run: node tests/csp-source-audit.mjs

      - name: Audit Product Registry and private-route boundaries
        run: node tests/product-registry-audit.mjs

      - name: Audit visual asset manifest coverage
        run: node tests/asset-manifest-audit.mjs

      - name: Audit ibis provider eligibility and economic invariants
        run: node tests/ibis-eligibility-audit.mjs

      - name: Audit ibis local DSP (BPM detection) correctness
        run: node tests/ibis-audio-analysis-audit.mjs

      - name: Audit ibis Caribbean Language ID (cited lexical-marker detection)
        run: node tests/ibis-caribbean-language-id-audit.mjs

      - name: Audit FTN Walkthrough Engine data model (no rendering yet)
        run: node tests/ftn-walkthrough-audit.mjs

      - name: Audit FTN Node Registry derivation
        run: node tests/ftn-node-registry-audit.mjs

      - name: Audit ibis project/asset graph (selective regeneration)
        run: node tests/ibis-project-graph-audit.mjs

      - name: Audit ibis music-workflow classifier (13 realistic requests)
        run: node tests/ibis-music-workflow-audit.mjs

      - name: Audit IBIS Client universal fabric (node permission + real execution)
        run: node tests/ibis-client-audit.mjs

      - name: Audit ibis voice identity registry (IAN/SARAFINA, dialect resolution)
        run: node tests/ibis-voice-registry-audit.mjs

      - name: Audit ibis runtime estimator (real local execution)
        run: node tests/ibis-runtime-estimator-audit.mjs

      - name: Audit FTNScreen Screenwriter (pipeline, project graph, honest fabric state)
        run: node tests/ftnscreen-screenwriter-audit.mjs

      - name: Audit ibis project QC (real completeness checking)
        run: node tests/ibis-project-qc-audit.mjs

      - name: Audit ibis music engine (real instrumental synthesis)
        run: node tests/ibis-music-engine-audit.mjs

      - name: Audit ibis SFX engine (real sound-effect synthesis)
        run: node tests/ibis-sfx-engine-audit.mjs

      - name: Install Playwright
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          # ubuntu-latest already carries Chromium's shared-library dependencies.
          # Avoid `--with-deps`: it can hang indefinitely when an apt mirror is
          # unavailable and prevent the browser release gates from running.
          npx playwright install chromium

      - name: Start static FTN server
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 > /tmp/ftn-server.log 2>&1 &
          echo $! > /tmp/ftn-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ftn-server.log
          exit 1

      - name: Run functional scenarios
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/functional-release.mjs

      - name: Verify shared platform foundation
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/foundation-release.mjs

      - name: Verify founder access and authentication callbacks
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/founder-access-release.mjs

      - name: Verify ibis Creative Studio and FTN Fire
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/creative-studio-release.mjs

      - name: Verify Turnstile safe readiness
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/turnstile-release.mjs

      - name: Run critical mobile scenarios
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/mobile-release.mjs

      - name: Verify FTN Surface System and ecosystem front door
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
          FTN_CAPTURE_DIR: test-artifacts
        run: node tests/surface-system-release.mjs

      - name: Upload FTN Surface System visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftn-surface-visual-evidence
          path: test-artifacts/*.png
          if-no-files-found: ignore

      - name: Open every indexed public route
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/all-public-routes.mjs

      - name: Enforce owned performance budgets
        env:
          FTN_TEST_BASE: http://127.0.0.1:3000
        run: node tests/performance-budget.mjs

      - name: Static broken-local-reference scan
        run: |
          python3 - <<'PY'
          import pathlib,re,sys,urllib.parse
          root=pathlib.Path('.')
          missing=[]
          attrs=re.compile(r'''(?:href|src)=["']([^"']+)["']''',re.I)
          excluded_roots={'node_modules','.git'}
          for html in root.rglob('*.html'):
              if any(part in excluded_roots for part in html.parts):
                  continue
              text=html.read_text(encoding='utf-8',errors='ignore')
              for raw in attrs.findall(text):
                  if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:','blob:','http://','https://','//')): continue
                  path=urllib.parse.urlsplit(raw).path
                  if not path: continue
                  if path.startswith('/'):
                      target=root/path.lstrip('/')
                  else:
                      target=html.parent/path
                  if path.endswith('/'):
                      target=target/'index.html'
                  elif target.is_dir():
                      target=target/'index.html'
                  if not target.exists(): missing.append(f'{html}: {raw}')
          if missing:
              print('Broken local references:')
              print('\n'.join(missing))
              sys.exit(1)
          print('No broken local href/src references found.')
          PY
