name: Deploy and verify ibis assistant gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Independent audit finding: ibis-assistant's actual served behavior lives mostly in
      # _shared/*.ts (the canonical brain, intent router, search adapter, lifecycle store, etc.) --
      # this filter previously omitted that directory entirely, so a fix landing there (e.g. the
      # freshness-marker correction in ibis-intent-router.ts, commit 75b5179) merged to main without
      # ever triggering a deploy, silently leaving production on the old, unfixed code.
      - 'supabase/functions/ibis-assistant/**'
      - 'supabase/functions/_shared/**'
      - 'scripts/verify-ibis-assistant-live.mjs'
      - '.github/workflows/ibis-assistant-release.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jshmidfpqrajxtukzges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # FTN Quality Pass (2026-09-18): supabase/setup-cli@v1 started failing every run today --
      # GitHub Actions removed the Node.js 20 runtime from its runners on 2026-09-16, and that
      # action's metadata still declares Node 20, so it can no longer resolve/execute at all (a
      # real, dated, upstream break, not something wrong with this repo). Installs the official
      # published binary directly instead, which has no dependency on the marketplace action's own
      # JS runtime -- see https://github.com/supabase/cli's own documented direct-install command.
      - name: Install Supabase CLI (direct binary -- supabase/setup-cli@v1 broken by GH Actions dropping Node 20 on 2026-09-16)
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz" | tar -xz
          sudo mv supabase /usr/local/bin/supabase
          supabase --version
      - name: Require scoped Supabase deployment credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Re-run the source reliability contract
        run: node --experimental-strip-types tests/ibis-intelligence-gateway-audit.mjs
      - name: Deploy the exact checked-out gateway source
        run: supabase functions deploy ibis-assistant --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify deployed version, deterministic answer, and live legacy freshness grounding
        run: node scripts/verify-ibis-assistant-live.mjs
