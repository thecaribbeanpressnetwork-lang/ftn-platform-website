name: ibis Supabase Remote MCP Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-remote-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: jshmidfpqrajxtukzges
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit Supabase CI credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured. Add a scoped Supabase personal access token as a repository Actions secret, then re-run this manual proof."
            exit 2
          fi
      - name: Install pinned official MCP v2 client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @modelcontextprotocol/client@2
      - name: Prove project-scoped read-only Supabase MCP
        run: node tests/ibis-supabase-remote-mcp-proof.mjs
