name: Update TTPS crime snapshot

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official TTPS comparative chart
        run: node scripts/update-ttps-crime.mjs
      - name: Commit a changed official snapshot
        run: |
          if git diff --quiet -- data/crime-statistics.json; then
            echo "No TTPS change"
            exit 0
          fi
          git config user.name "FTN Observer Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/crime-statistics.json
          git commit -m "data(observer): update TTPS crime snapshot"
          git push
