name: One-time ibis-ai public surface correction
on:
  push:
    paths: ['.github/workflows/one-time-ibis-public-surface-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct ibis-ai page identity and retire correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ibis-ai/index.html')
          s=p.read_text()
          if 'FTN ibis' not in s:
              raise SystemExit('No stale FTN ibis public labels found')
          s=s.replace('FTN ibis','ibis-ai').replace('Ai powered','AI powered')
          p.write_text(s)
          PY
          node tests/product-registry-audit.mjs
          node scripts/sync-footer.mjs --check
          git config user.name 'FTN Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-ibis-public-surface-fix.yml
          git add ibis-ai/index.html
          git diff --cached --check
          git commit -m 'Finish ibis-ai public identity correction'
          git push origin HEAD:main
