name: One-time FTN five-bucket integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/complete-five-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate FTN completion surfaces'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire shared intelligence surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def add_before(path, needle, addition):
              p=Path(path); s=p.read_text()
              if addition.strip() in s:
                  return
              if needle not in s:
                  raise SystemExit(f'anchor missing in {path}: {needle}')
              p.write_text(s.replace(needle, addition+needle, 1))

          add_before('screen/index.html','</body>','<script src="/js/screen-festival-scout.js?v=20260827.1"></script>')
          add_before('opportunities/index.html','</body>','<script src="/js/scout-feed.js?v=20260827.1"></script><script src="/js/opportunities-scout.js?v=20260827.1"></script>')
          add_before('god-mode/index.html','</body>','<script src="/js/scout-feed.js?v=20260827.1"></script><script src="/js/nexus-intelligence.js?v=20260827.1"></script><script src="/js/nexus-memory.js?v=20260827.1"></script>')

          p=Path('js/mayor-operational.js'); s=p.read_text().replace("/data/scout-2-findings-2026-08-27.json","/data/scout-2-current.json"); p.write_text(s)
          p=Path('scripts/ftn-scout-2.mjs'); s=p.read_text().replace("data/scout-2-findings-2026-08-27.json","data/scout-2-current.json"); p.write_text(s)

          for path in ['js/screen-workspace.js','js/opportunities-workspace.js']:
              p=Path(path); s=p.read_text().replace('ibis.ai','ibis-ai'); p.write_text(s)

          Path('.github/workflows/complete-five-integration.yml').unlink()
          PY
      - name: Verify integration contracts
        run: |
          node --check js/mayor-operational.js
          node --check js/scout-feed.js
          node --check js/nexus-intelligence.js
          node --check js/nexus-memory.js
          node --check js/screen-festival-scout.js
          node --check js/opportunities-scout.js
          node --check js/screen-workspace.js
          node --check js/opportunities-workspace.js
          node --check scripts/ftn-scout-2.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/scout-2-current.json')); JSON.parse(require('fs').readFileSync('data/screen-festival-opportunities.json'));"
          grep -q 'screen-festival-scout.js' screen/index.html
          grep -q 'opportunities-scout.js' opportunities/index.html
          grep -q 'nexus-memory.js' god-mode/index.html
          ! grep -q 'ibis.ai' js/screen-workspace.js
      - name: Commit integrated surfaces
        run: |
          git config user.name "FTN Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add screen/index.html opportunities/index.html god-mode/index.html js/mayor-operational.js scripts/ftn-scout-2.mjs js/screen-workspace.js js/opportunities-workspace.js .github/workflows/complete-five-integration.yml
          git commit -m "Integrate FTN completion surfaces"
          git push
