name: ibis Headspace Browser Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start static FTN server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ftn-headspace-server.log 2>&1 &
          echo $! > /tmp/ftn-headspace-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ftn-headspace-server.log
          exit 1
      - name: Audit Headspace interactions and responsive presentation
        env:
          FTN_TEST_BASE: http://127.0.0.1:4173
        run: node tests/ibis-headspace-browser-audit.mjs
      - name: Upload Headspace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibis-headspace-visual-evidence
          path: test-artifacts/ibis-headspace-*.png
          if-no-files-found: ignore
