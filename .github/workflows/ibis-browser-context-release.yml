name: ibis Browser Search Context Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ftn-ibis-browser-extension/**'
      - 'supabase/functions/ibis-browser-context/**'
      - 'supabase/functions/_shared/ibis-intelligence-gateway.ts'
      - '.github/workflows/ibis-browser-context-release.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ftn-ibis-browser-extension/**'
      - 'supabase/functions/ibis-browser-context/**'
      - 'supabase/functions/_shared/ibis-intelligence-gateway.ts'
      - '.github/workflows/ibis-browser-context-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser companion privacy, capture contract and package
        run: node apps/ftn-ibis-browser-extension/test.mjs
      - name: Upload browser companion package
        uses: actions/upload-artifact@v4
        with:
          name: ftn-ibis-browser-companion-0.2.1
          path: apps/ftn-ibis-browser-extension/dist/ftn-ibis-chrome-store-0.2.1.zip
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jshmidfpqrajxtukzges
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_-1v6ZXAU3sXc7Z0L2VnFgw_638Qxu3z
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require scoped Supabase deployment credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Deploy browser-context reasoning lane
        run: supabase functions deploy ibis-browser-context --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify authenticated function rejects empty evidence safely
        run: |
          code=$(curl -sS -o /tmp/ibis-browser-context-empty.json -w '%{http_code}' \
            -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ibis-browser-context" \
            -H 'content-type: application/json' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --data '{"question":"test","context":{}}')
          cat /tmp/ibis-browser-context-empty.json
          test "$code" = "400"
      - name: Prove live browser-result reasoning with synthetic evidence
        run: |
          cat > /tmp/browser-proof.json <<'JSON'
          {
            "question": "What should a Caribbean research assistant conclude from these results?",
            "context": {
              "engine": "google",
              "query": "Caribbean digital public infrastructure research",
              "sourceUrl": "https://www.google.com/search?q=Caribbean+digital+public+infrastructure+research",
              "capturedAt": "2026-09-17T17:00:00Z",
              "captureMode": "USER_BROWSER",
              "results": [
                {
                  "rank": 1,
                  "title": "Caribbean digital transformation research",
                  "url": "https://example.org/caribbean-digital-transformation",
                  "snippet": "Regional digital transformation work emphasizes interoperable public infrastructure, trusted data governance and practical local capacity."
                },
                {
                  "rank": 2,
                  "title": "Caribbean innovation ecosystems",
                  "url": "https://example.net/caribbean-innovation",
                  "snippet": "Caribbean innovation programs increasingly connect government, business, research and community organizations around shared digital capabilities."
                }
              ]
            }
          }
          JSON
          code=$(curl -sS -o /tmp/ibis-browser-context-live.json -w '%{http_code}' \
            -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/ibis-browser-context" \
            -H 'content-type: application/json' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --data-binary @/tmp/browser-proof.json)
          cat /tmp/ibis-browser-context-live.json
          test "$code" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/ibis-browser-context-live.json', 'utf8'));
          if (!String(body.answer || '').trim()) throw new Error('browser context returned no answer');
          if (body.evidenceState !== 'USER_PROVIDED_WEB_CONTEXT') throw new Error('wrong evidenceState: ' + body.evidenceState);
          if (!Array.isArray(body.sources) || body.sources.length !== 2) throw new Error('browser sources missing');
          if (!body.sources.every((source) => source.evidenceDepth === 'SNIPPET' && /^https:\/\//.test(source.url || ''))) throw new Error('source provenance invalid');
          if (!body.browserContext || body.browserContext.engine !== 'google' || body.browserContext.captureMode !== 'USER_BROWSER') throw new Error('browser context metadata invalid');
          if (!String(body.provenanceNotice || '').includes('browser')) throw new Error('provenance notice missing');
          if (/Objective:|User Value:|Ecosystem Value:|Ownership:|Data Value:/i.test(String(body.answer))) throw new Error('founder framework leaked into ordinary answer');
          console.log('LIVE BROWSER CONTEXT PASS', JSON.stringify({provider: body.provider, model: body.model, sources: body.sources.length, evidenceState: body.evidenceState}));
          NODE

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ibis-browser-companion-v0.2.1
      RELEASE_ASSET: ftn-ibis-chrome-store-0.2.1.zip
    steps:
      - name: Download verified browser companion artifact
        uses: actions/download-artifact@v4
        with:
          name: ftn-ibis-browser-companion-0.2.1
          path: /tmp/ibis-browser-companion
      - name: Publish immutable browser companion release
        run: |
          asset="/tmp/ibis-browser-companion/${RELEASE_ASSET}"
          test -s "$asset"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving its immutable asset."
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$asset#FTN ibis Browser Companion 0.2.1" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FTN ibis Browser Companion 0.2.1" \
              --notes "Fixes Bing capture: every organic result was wrapped in a bing.com/ck/a click-tracking redirect that the 0.2.0 capture logic treated as internal and silently discarded, so Bing produced zero results. Verified Chrome/Opera browser companion. Search normally in Google, Bing or DuckDuckGo, press Include browser search, and let FTN ibis reason over the visible titles, links and snippets. No browser cookies, passwords, account tokens or browsing history are sent to ibis."
          fi
