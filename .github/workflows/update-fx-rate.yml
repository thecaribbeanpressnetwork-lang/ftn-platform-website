name: Update Central Bank FX rate snapshot

on:
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official Central Bank monthly exchange-rate table
        run: node scripts/update-fx-rate.mjs
      - name: Commit a changed official snapshot
        run: |
          if git diff --quiet -- data/fx-usd-ttd.json; then
            echo "No FX change"
            exit 0
          fi
          git config user.name "FTN Observer Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fx-usd-ttd.json
          git commit -m "data(statistics): update Central Bank FX rate snapshot"
          git push
