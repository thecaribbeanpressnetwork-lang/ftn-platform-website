<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ Tube Creator Studio | FTN Platform</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/components/buttons.css"><link rel="stylesheet" href="/css/components/nav.css"><link rel="stylesheet" href="/css/components/footer.css"><link rel="stylesheet" href="/css/dj-tube.css"><style>main{padding:48px 0 80px}.studio{max-width:1050px;margin:auto}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field input,.field textarea,.field select{padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit}.field textarea{min-height:120px}.status{padding:12px;border-radius:9px;background:#f3f3f3;margin:12px 0}.video-row{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid #eee}.muted{color:#666}@media(max-width:700px){.grid{grid-template-columns:1fr}.video-row{display:block}}</style></head><body><header class="site-header"><div class="container site-header__bar"><a class="site-header__logo" href="/">FTN PLATFORM</a><div class="site-header__actions"><a class="btn btn-secondary btn-sm" href="/dj-tube/">Back to DJ Tube</a></div></div></header><main><div class="container studio"><p class="dj-kicker">DJ Tube</p><h1>Creator Studio</h1><p class="muted">Create your DJ profile and publish video links to DJ Tube.</p><div id="status" class="status">Connecting…</div><section id="profilePanel" class="panel" hidden><h2>Your creator profile</h2><form id="profileForm"><div class="grid"><label class="field"><span>Stage name</span><input id="stageName" required></label><label class="field"><span>Country</span><input id="country"></label></div><label class="field"><span>Bio</span><textarea id="bio"></textarea></label><button class="btn btn-primary" type="submit">Save profile</button></form></section><section id="videoPanel" class="panel" hidden><h2>Publish a video</h2><form id="videoForm"><div class="grid"><label class="field"><span>Title</span><input id="videoTitle" required></label><label class="field"><span>Genre</span><select id="genre"><option>Soca</option><option>Dancehall</option><option>Reggae</option><option>Bouyon</option><option>Calypso</option><option>Caribbean</option><option>Live Sessions</option></select></label></div><label class="field"><span>YouTube or video URL</span><input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." required></label><label class="field"><span>Description</span><textarea id="description"></textarea></label><button class="btn btn-primary" type="submit">Submit for publishing</button></form></section><section id="videosPanel" class="panel" hidden><h2>Your videos</h2><div id="videos"></div></section><section id="loginPanel" class="panel"><h2>Creator sign in</h2><p class="muted">Use the FTN account system to access Creator Studio.</p><button id="loginButton" class="btn btn-primary">Send magic link</button></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/dj-tube-studio.js"></script></body></html>
